<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Chatbot Tematik{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="--primary: {% block color %}#334155{% endblock %};">
  <header class="topbar">
    <a href="{{ url_for('index') }}" class="brand">💻 TechMate</a>
    {% block header_extra %}{% endblock %}
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">Praktikum Aplikasi Web &middot; Flask</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
